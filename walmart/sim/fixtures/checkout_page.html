<!DOCTYPE html>
<html><head><title>Test Checkout - Walmart</title></head>
<body>
<h1>Checkout</h1>
<!-- Walmart's real /checkout page is a React SPA; presence of these phrases
     is what purchase_executor uses to confirm checkout page loaded. -->
<div data-automation-id="checkout-page">
  <section>
    <h2>Order summary</h2>
    <p>Payment | Shipping | Delivery | Place order | Credit | Fulfillment</p>
  </section>
  <!-- Place Order button — bot's _confirm_shipping() takes a fast-path when
       this is already visible (line 1801-1805 in purchase_executor.py),
       skipping the 6-step Continue-button loop. Without this the bot wastes
       ~40s scanning for buttons that don't exist on a minimal fixture.
       Hybrid checkout (WALMART_CHECKOUT_API=1) doesn't actually click this
       — it fires CreateContract via GraphQL — but presence triggers the
       fast-path skip. -->
  <button data-automation-id="place-order-btn">Place order</button>
</div>
<script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"initialData":{"data":{"cart":{"id":"test-cart-id-001","cartId":"test-cart-id-001","cartLines":[{"usItemId":"19012610850","offerId":"test-offer-id-001","lineItemId":"test-line-id-001","quantity":1,"productName":"Pokemon TCG Test Item","fulfillmentPreference":"DELIVERY","availableFulfillmentOptions":["SCHEDULED_DELIVERY","SCHEDULED_PICKUP"],"isPharmacyPrescription":false}]}}}}},"query":{},"buildId":"sim-test"}</script>
<script>
  // Mimic Next.js runtime
  (function() {
    var el = document.getElementById("__NEXT_DATA__");
    if (el && el.textContent) {
      try { window.__NEXT_DATA__ = JSON.parse(el.textContent); } catch(e) {}
    }
  })();
</script>
</body></html>
